name: CI/CD Pipeline

on:
  # 1. Ejecución automática al detectar cambios (push)
  push:
    branches: [main, develop]

  # 2. Ejecución manual con parámetros
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno de despliegue"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      skip_deploy:
        description: "Saltar fase de despliegue"
        required: false
        default: false
        type: boolean

  # 3. Ejecución periódica (cron) - Lunes a las 3:00 AM
  schedule:
    - cron: "0 3 * * 1"

  # 4. Disparador adicional - Pull Requests
  pull_request:
    branches: [main]

env:
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/dnd-board-front

jobs:
  # ============================================================================
  # JOB 1: Análisis de calidad del código + Tests
  # ============================================================================
  quality:
    name: Lint & Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_dnd_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # ---------- FRONTEND ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/dnd-board-front/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: frontend/dnd-board-front
        run: npm ci

      - name: Lint frontend (ESLint)
        working-directory: frontend/dnd-board-front
        run: npm run lint

      - name: Tests frontend (Vitest)
        working-directory: frontend/dnd-board-front
        run: npm run test -- --coverage

      # ---------- BACKEND ----------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, bcmath, gd, exif, pcntl
          coverage: xdebug

      - name: Instalar dependencias backend (Composer)
        working-directory: backend/dnd-board
        run: composer install --prefer-dist --no-progress

      - name: Lint backend (Laravel Pint)
        working-directory: backend/dnd-board
        run: ./vendor/bin/pint --test

      - name: Preparar entorno backend
        working-directory: backend/dnd-board
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_dnd_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Tests backend (PHPUnit)
        working-directory: backend/dnd-board
        run: php artisan test --coverage-text
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_dnd_test
          DB_USERNAME: root
          DB_PASSWORD: root

  # ============================================================================
  # JOB 2: Build + Publicación de imágenes Docker
  # ============================================================================
  build-and-publish:
    name: Build & Publish Docker Images
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata para tags Docker
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Build imagen Alpine
        uses: docker/build-push-action@v5
        with:
          context: frontend/dnd-board-front
          file: frontend/dnd-board-front/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:alpine-${{ steps.meta.outputs.short_sha }}
            ${{ env.DOCKERHUB_REPO }}:alpine-latest

      - name: Build imagen Debian
        uses: docker/build-push-action@v5
        with:
          context: frontend/dnd-board-front
          file: frontend/dnd-board-front/Dockerfile.debian
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:debian-${{ steps.meta.outputs.short_sha }}
            ${{ env.DOCKERHUB_REPO }}:debian-latest

      # Escaneo de seguridad con ClamAV (instalado en el runner, sin daemon)
      - name: Instalar ClamAV y actualizar firmas
        run: |
          sudo apt-get install -y clamav --no-install-recommends
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam

      - name: Escaneo ClamAV (antivirus)
        run: |
          # Exportar imagen a tar y escanear
          docker save ${{ env.DOCKERHUB_REPO }}:alpine-${{ steps.meta.outputs.short_sha }} -o /tmp/image.tar
          clamscan --no-summary --infected /tmp/image.tar
          echo "✅ Escaneo ClamAV completado"

  # ============================================================================
  # JOB 3: Despliegue automático en VPS
  # ============================================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: |
      (github.ref == 'refs/heads/main') &&
      (github.event.inputs.skip_deploy != 'true')

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Desplegar en VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/dnd-board || mkdir -p ~/dnd-board && cd ~/dnd-board

            # Actualizar código del repositorio
            if [ -d .git ]; then
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }}.git .
            fi

            # Primera vez: instalar con make install-prod (crea .env, build + up)
            # Siguientes veces: reconstruir imagen desde el nuevo código y levantar
            if [ "$(docker compose --profile prod ps -q 2>/dev/null | wc -l)" -eq 0 ]; then
              make install-prod
            else
              docker compose --profile prod build
              make up
              make migrate
            fi

            # Limpieza de imágenes antiguas
            docker image prune -f

  # ============================================================================
  # JOB 4: Pruebas post-despliegue + Notificaciones
  # ============================================================================
  post-deploy:
    name: Post-Deploy Tests & Notifications
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && needs.deploy.result != 'skipped'

    steps:
      - name: Esperar a que el servicio arranque
        run: sleep 30

      - name: Prueba funcional - Health check frontend
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.VPS_HOST }}:8001 || echo "000")
          echo "Frontend HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Frontend no responde correctamente (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - name: Prueba funcional - Health check backend API
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.VPS_HOST }}:8000/api/login -X POST -H "Content-Type: application/json" -d '{"email":"test@test.com","password":"test"}' || echo "000")
          echo "Backend API HTTP Status: $HTTP_STATUS"
          # 401 o 422 significan que la API responde correctamente (valida input)
          if [ "$HTTP_STATUS" -eq 000 ]; then
            echo "::error::Backend API no responde"
            exit 1
          fi
          echo "Backend API respondiendo correctamente"

      - name: Monitorización - Estado de contenedores
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== Estado de contenedores ==="
            cd ~/dnd-board
            docker compose ps
            echo ""
            echo "=== Uso de recursos ==="
            docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}"

      # ---------- NOTIFICACIONES ----------
      - name: Notificación de ÉXITO por email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Deploy exitoso - DnD Board (${{ github.ref_name }})"
          body: |
            El pipeline CI/CD se ha completado correctamente.

            📋 Detalles:
            - Repositorio: ${{ github.repository }}
            - Rama: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Actor: ${{ github.actor }}
            - Fecha: ${{ github.event.head_commit.timestamp }}

            🔗 Ver ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ secrets.MAIL_USERNAME }}
          from: "DnD Board CI/CD <${{ secrets.MAIL_USERNAME }}>"

      - name: Notificación de FALLO por email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Deploy FALLIDO - DnD Board (${{ github.ref_name }})"
          body: |
            El pipeline CI/CD ha fallado.

            📋 Detalles:
            - Repositorio: ${{ github.repository }}
            - Rama: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Actor: ${{ github.actor }}

            ❌ Motivo: Uno o más pasos del despliegue o verificación post-deploy han fallado.

            🔗 Ver logs del error: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Revisa los logs del workflow para más detalles.
          to: ${{ secrets.MAIL_USERNAME }}
          from: "DnD Board CI/CD <${{ secrets.MAIL_USERNAME }}>"
