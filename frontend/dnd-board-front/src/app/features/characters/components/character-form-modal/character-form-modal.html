<div
  class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-stone-950/70 backdrop-blur-md"
>
  <div class="w-full max-w-lg bg-stone-900 border border-amber-900/40 rounded-2xl p-8 shadow-2xl shadow-black/50 max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="text-center mb-8">
      <h3 class="text-2xl font-black text-amber-400 uppercase tracking-wider">
        @if (isEditing()) {
          Editar Personaje
        } @else {
          Nuevo Personaje
        }
      </h3>
      <p class="text-stone-400 text-sm mt-2">Ficha de personaje para tus aventuras</p>
    </div>

    <form class="space-y-5">
      <!-- Name -->
      <label class="block">
        <span class="text-xs font-bold uppercase text-stone-300 tracking-wider ml-1">Nombre</span>
        <input
          [formField]="characterForm.name"
          type="text"
          placeholder="Gandalf el Gris"
          class="mt-1 w-full px-4 py-3 bg-stone-800/50 border border-amber-900/30 rounded-lg text-stone-200 placeholder-stone-600 focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600/50 transition-all"
        />
        @if (characterForm.name().invalid() && characterForm.name().touched()) {
          <p class="text-[10px] text-red-400 font-bold mt-1 uppercase tracking-tighter ml-1">
            {{ characterForm.name().errors()[0].message }}
          </p>
        }
      </label>

      <!-- HP & Speed -->
      <div class="grid grid-cols-2 gap-4">
        <label class="block">
          <span class="text-xs font-bold uppercase text-stone-300 tracking-wider ml-1">HP</span>
          <input
            [formField]="characterForm.hp"
            type="number"

            class="mt-1 w-full px-4 py-3 bg-stone-800/50 border border-amber-900/30 rounded-lg text-stone-200 focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600/50 transition-all"
          />
        </label>
        <label class="block">
          <span class="text-xs font-bold uppercase text-stone-300 tracking-wider ml-1">Velocidad</span>
          <input
            [formField]="characterForm.speed"
            type="number"

            class="mt-1 w-full px-4 py-3 bg-stone-800/50 border border-amber-900/30 rounded-lg text-stone-200 focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600/50 transition-all"
          />
        </label>
      </div>

      <!-- Stats -->
      <div>
        <span class="text-xs font-bold uppercase text-stone-300 tracking-wider ml-1 block mb-2">Estadísticas (1-30)</span>
        <div class="grid grid-cols-3 gap-3">
          <label class="block">
            <span class="text-[10px] font-bold uppercase text-stone-500 tracking-wider ml-1">Fuerza</span>
            <input
              [formField]="characterForm.strength"
              type="number"


              class="mt-1 w-full px-3 py-2 bg-stone-800/50 border border-amber-900/30 rounded-lg text-stone-200 text-center focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600/50 transition-all"
            />
          </label>
          <label class="block">
            <span class="text-[10px] font-bold uppercase text-stone-500 tracking-wider ml-1">Destreza</span>
            <input
              [formField]="characterForm.dexterity"
              type="number"


              class="mt-1 w-full px-3 py-2 bg-stone-800/50 border border-amber-900/30 rounded-lg text-stone-200 text-center focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600/50 transition-all"
            />
          </label>
          <label class="block">
            <span class="text-[10px] font-bold uppercase text-stone-500 tracking-wider ml-1">Constitución</span>
            <input
              [formField]="characterForm.constitution"
              type="number"


              class="mt-1 w-full px-3 py-2 bg-stone-800/50 border border-amber-900/30 rounded-lg text-stone-200 text-center focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600/50 transition-all"
            />
          </label>
          <label class="block">
            <span class="text-[10px] font-bold uppercase text-stone-500 tracking-wider ml-1">Inteligencia</span>
            <input
              [formField]="characterForm.intelligence"
              type="number"


              class="mt-1 w-full px-3 py-2 bg-stone-800/50 border border-amber-900/30 rounded-lg text-stone-200 text-center focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600/50 transition-all"
            />
          </label>
          <label class="block">
            <span class="text-[10px] font-bold uppercase text-stone-500 tracking-wider ml-1">Sabiduría</span>
            <input
              [formField]="characterForm.wisdom"
              type="number"


              class="mt-1 w-full px-3 py-2 bg-stone-800/50 border border-amber-900/30 rounded-lg text-stone-200 text-center focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600/50 transition-all"
            />
          </label>
          <label class="block">
            <span class="text-[10px] font-bold uppercase text-stone-500 tracking-wider ml-1">Carisma</span>
            <input
              [formField]="characterForm.charisma"
              type="number"


              class="mt-1 w-full px-3 py-2 bg-stone-800/50 border border-amber-900/30 rounded-lg text-stone-200 text-center focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600/50 transition-all"
            />
          </label>
        </div>
      </div>

      <!-- Actions -->
      <div class="grid grid-cols-2 gap-4 pt-4">
        <button
          type="button"
          (click)="dismiss()"
          class="w-full py-3 bg-stone-800 border border-stone-700 text-stone-300 hover:bg-stone-700 hover:text-stone-100 font-bold rounded-lg transition-all uppercase tracking-widest text-xs"
        >
          Cancelar
        </button>
        <button
          type="button"
          (click)="submit()"
          [disabled]="characterForm().invalid() || isSaving()"
          class="w-full py-3 bg-amber-600 hover:bg-amber-500 disabled:bg-stone-700 disabled:cursor-not-allowed text-stone-900 font-black rounded-lg shadow-lg shadow-amber-900/30 transition-all uppercase tracking-wide text-xs active:scale-95"
        >
          @if (isSaving()) {
            <span class="animate-pulse">Guardando...</span>
          } @else if (isEditing()) {
            Guardar Cambios
          } @else {
            Crear Personaje
          }
        </button>
      </div>
    </form>
  </div>
</div>
