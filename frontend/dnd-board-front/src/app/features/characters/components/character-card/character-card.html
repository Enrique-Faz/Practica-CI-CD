<div
  class="bg-stone-900/60 border border-amber-900/30 rounded-xl px-6 py-4 shadow-lg hover:border-amber-600/50 transition-all flex items-center gap-0"
>
  <!-- Sección 1: Nombre / Clase / HP -->
  <div class="w-80 shrink-0">
    <div class="relative group/name">
      <h3
        class="text-base font-black text-stone-100 uppercase tracking-wide leading-tight truncate"
      >
        {{ character().name }}
      </h3>
      <span
        class="pointer-events-none absolute -top-8 left-0 z-10 whitespace-nowrap rounded-md bg-stone-800 border border-amber-900/40 px-2 py-1 text-xs font-bold text-stone-100 shadow-lg opacity-0 transition-opacity group-hover/name:opacity-100"
      >
        {{ character().name }}
      </span>
    </div>

    <img
      [src]="classImage()"
      [alt]="character().class"
      class="mt-2 w-80 h-96 rounded-lg object-cover border border-amber-900/40"
    />

    <div class="mt-1 flex items-center gap-2">
      <p class="text-xs text-amber-400/80 font-semibold capitalize">
        {{ character().class }}
      </p>
      <span
        class="px-2 py-0.5 bg-red-900/30 border border-red-700/40 rounded text-red-400 text-xs font-bold"
      >
        {{ character().hp }} HP
      </span>
    </div>
  </div>

  <!-- Divider -->
  <div class="w-px mx-6 self-stretch bg-amber-900/30 shrink-0"></div>

  <!-- Sección 2: Stats + Velocidad -->
  <div class="flex-1 shrink-0">
    <div class="grid grid-cols-3 gap-x-8 gap-y-4">
      @for (stat of stats(); track stat.label) {
        <div class="text-center">
          <p class="text-xs text-stone-500 uppercase font-bold tracking-wider">{{ stat.label }}</p>
          <p class="text-3xl font-black text-stone-200">{{ stat.value }}</p>
        </div>
      }
      <div class="text-center">
        <p class="text-xs text-stone-500 uppercase font-bold tracking-wider">VEL</p>
        <p class="text-3xl font-black text-amber-400">{{ character().speed }}</p>
      </div>
    </div>
  </div>

  <!-- Divider -->
  <div class="w-px mx-6 self-stretch bg-amber-900/30 shrink-0"></div>

  <!-- Sección 3: Botones -->
  <app-card-actions primaryLabel="Editar" (onPrimary)="edit()" (onDelete)="delete()" />
</div>
