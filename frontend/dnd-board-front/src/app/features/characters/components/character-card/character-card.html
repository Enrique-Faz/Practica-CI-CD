<div
  class="bg-stone-900/60 border border-amber-900/30 rounded-xl px-6 py-4 shadow-lg hover:border-amber-600/50 transition-all flex items-center gap-0"
>
  <!-- Sección 1: Nombre / HP -->
  <div class="w-44 shrink-0">
    <div class="relative group/name">
      <h3
        class="text-base font-black text-stone-100 uppercase tracking-wide leading-tight truncate"
      >
        {{ character().name }}
      </h3>
      <span
        class="pointer-events-none absolute -top-8 left-0 z-10 whitespace-nowrap rounded-md bg-stone-800 border border-amber-900/40 px-2 py-1 text-xs font-bold text-stone-100 shadow-lg opacity-0 transition-opacity group-hover/name:opacity-100"
      >
        {{ character().name }}
      </span>
    </div>
    <span
      class="mt-1 inline-block px-2 py-0.5 bg-red-900/30 border border-red-700/40 rounded text-red-400 text-xs font-bold"
    >
      {{ character().hp }} HP
    </span>
  </div>

  <!-- Divider -->
  <div class="w-px mx-6 self-stretch bg-amber-900/30 shrink-0"></div>

  <!-- Sección 2: Stats + Velocidad -->
  <div class="flex items-center gap-4 flex-1 shrink-0">
    @for (stat of stats(); track stat.label) {
      <div class="w-10 text-center shrink-0">
        <p class="text-[10px] text-stone-500 uppercase font-bold">{{ stat.label }}</p>
        <p class="text-sm font-black text-stone-200">{{ stat.value }}</p>
      </div>
    }
    <div class="w-px mx-2 self-stretch bg-amber-900/20 shrink-0"></div>
    <div class="w-10 text-center shrink-0">
      <p class="text-[10px] text-stone-500 uppercase font-bold">VEL</p>
      <p class="text-sm font-black text-stone-200">{{ character().speed }}</p>
    </div>
  </div>

  <!-- Divider -->
  <div class="w-px mx-6 self-stretch bg-amber-900/30 shrink-0"></div>

  <!-- Sección 3: Botones -->
  <div class="flex gap-2 w-40 shrink-0 justify-end ml-4">
    <button
      (click)="edit()"
      class="px-4 py-2 bg-amber-700/30 hover:bg-amber-700/50 text-amber-400 text-xs font-bold rounded-lg uppercase tracking-wide transition-colors"
    >
      Editar
    </button>
    <button
      (click)="delete()"
      class="px-4 py-2 bg-red-900/30 hover:bg-red-900/50 text-red-400 text-xs font-bold rounded-lg uppercase tracking-wide transition-colors"
    >
      Borrar
    </button>
  </div>
</div>
