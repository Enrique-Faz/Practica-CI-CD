<div class="min-h-screen bg-stone-950 flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-stone-900/60 border border-amber-900/30 rounded-2xl p-8 shadow-xl">
    <!-- Header -->
    <div class="mb-8 text-center">
      <img src="logo.png" alt="Beers & Dragons" class="h-16 mx-auto mb-4 object-contain" />
      <h2 class="text-3xl font-black text-amber-400 tracking-wider uppercase">Entrar</h2>
      <p class="text-stone-400 text-sm mt-2">Accede a tu tablero de D&D</p>
    </div>

    @if (errorMessage()) {
      <div
        class="mb-5 p-3 bg-red-900/20 border border-red-500/50 rounded-lg text-red-300 text-xs font-bold"
      >
        {{ errorMessage() }}
      </div>
    }

    <form class="space-y-5">
      <!-- Email -->
      <label class="block">
        <span class="text-xs font-bold uppercase text-stone-300 tracking-wider ml-1">Email</span>
        <input
          [formField]="loginForm.email"
          id="email"
          type="email"
          placeholder="tu@email.com"
          autocomplete="email"
          class="mt-1 w-full px-4 py-3 bg-stone-800/50 border border-amber-900/30 rounded-lg text-stone-200 placeholder-stone-600 focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600/50 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
        />
        @if (loginForm.email().invalid() && loginForm.email().touched()) {
          <p class="text-[10px] text-red-400 font-bold mt-1 uppercase tracking-tighter ml-1">
            {{ loginForm.email().errors()[0].message }}
          </p>
        }
      </label>

      <!-- Password -->
      <label class="block">
        <span class="text-xs font-bold uppercase text-stone-300 tracking-wider ml-1"
          >Contraseña</span
        >
        <input
          [formField]="loginForm.password"
          id="password"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
          class="mt-1 w-full px-4 py-3 bg-stone-800/50 border border-amber-900/30 rounded-lg text-stone-200 placeholder-stone-600 focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600/50 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
        />
        @if (loginForm.password().invalid() && loginForm.password().touched()) {
          <p class="text-[10px] text-red-400 font-bold mt-1 uppercase tracking-tighter ml-1">
            {{ loginForm.password().errors()[0].message }}
          </p>
        }
      </label>

      <!-- Submit -->
      <div class="pt-2">
        <button
          type="button"
          (click)="submit()"
          [disabled]="loginForm().invalid() || isLoading()"
          class="w-full py-3 bg-amber-600 hover:bg-amber-500 disabled:bg-stone-700 disabled:cursor-not-allowed text-stone-900 font-bold rounded-lg transition-all disabled:opacity-50 uppercase text-sm tracking-wide shadow-lg shadow-amber-900/30"
        >
          @if (isLoading()) {
            <span class="animate-pulse">Entrando...</span>
          } @else {
            Entrar
          }
        </button>
      </div>
    </form>

    <!-- Footer links -->
    <div class="mt-8 text-center space-y-3">
      <p class="text-stone-400 text-sm">
        ¿No tienes cuenta?
        <a
          routerLink="/auth/register"
          class="text-amber-400 hover:text-amber-300 font-bold transition-colors"
        >
          Registrarse
        </a>
      </p>
      <a
        routerLink="/"
        class="inline-block text-xs text-stone-500 hover:text-stone-300 transition-colors"
      >
        Volver al inicio
      </a>
    </div>
  </div>
</div>
