<div class="min-h-screen bg-stone-950 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-xl bg-stone-900/60 border border-amber-900/30 rounded-2xl p-8 shadow-xl">
    <!-- Header -->
    <div class="mb-8 text-center">
      <img src="logo.png" alt="Beers & Dragons" class="h-16 mx-auto mb-4 object-contain" />
      <h2 class="text-3xl font-black text-amber-400 tracking-wider uppercase">Crear Cuenta</h2>
      <p class="text-stone-400 text-sm mt-2">Únete a la mesa de aventuras</p>
    </div>

    @if (errorMessage()) {
      <div
        class="mb-5 p-3 bg-red-900/20 border border-red-500/50 rounded-lg text-red-300 text-xs font-bold"
      >
        {{ errorMessage() }}
      </div>
    }

    <form class="space-y-5">
      <!-- Nombre y Apellidos -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <label class="block">
          <span class="text-xs font-bold uppercase text-stone-300 tracking-wider ml-1">Nombre</span>
          <input
            [formField]="registerForm.firstName"
            type="text"
            placeholder="Thorin"
            autocomplete="given-name"
            class="mt-1 w-full px-4 py-3 bg-stone-800/50 border border-amber-900/30 rounded-lg text-stone-200 placeholder-stone-600 focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600/50 transition-all disabled:opacity-50"
          />
          @if (registerForm.firstName().invalid() && registerForm.firstName().touched()) {
            <p class="text-[10px] text-red-400 font-bold mt-1 uppercase tracking-tighter ml-1">
              {{ registerForm.firstName().errors()[0].message }}
            </p>
          }
        </label>

        <label class="block">
          <span class="text-xs font-bold uppercase text-stone-300 tracking-wider ml-1"
            >Apellidos</span
          >
          <input
            [formField]="registerForm.lastName"
            type="text"
            placeholder="Escudoencina"
            autocomplete="family-name"
            class="mt-1 w-full px-4 py-3 bg-stone-800/50 border border-amber-900/30 rounded-lg text-stone-200 placeholder-stone-600 focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600/50 transition-all disabled:opacity-50"
          />
          @if (registerForm.lastName().invalid() && registerForm.lastName().touched()) {
            <p class="text-[10px] text-red-400 font-bold mt-1 uppercase tracking-tighter ml-1">
              {{ registerForm.lastName().errors()[0].message }}
            </p>
          }
        </label>
      </div>

      <!-- Email -->
      <label class="block">
        <span class="text-xs font-bold uppercase text-stone-300 tracking-wider ml-1">Email</span>
        <input
          [formField]="registerForm.email"
          type="email"
          placeholder="aventurero@dnd.com"
          autocomplete="email"
          class="mt-1 w-full px-4 py-3 bg-stone-800/50 border border-amber-900/30 rounded-lg text-stone-200 placeholder-stone-600 focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600/50 transition-all disabled:opacity-50"
        />
        @if (registerForm.email().invalid() && registerForm.email().touched()) {
          <p class="text-[10px] text-red-400 font-bold mt-1 uppercase tracking-tighter ml-1">
            {{ registerForm.email().errors()[0].message }}
          </p>
        }
      </label>

      <!-- Contraseña -->
      <label class="block">
        <span class="text-xs font-bold uppercase text-stone-300 tracking-wider ml-1"
          >Contraseña</span
        >
        <input
          [formField]="registerForm.password"
          type="password"
          placeholder="••••••••"
          autocomplete="new-password"
          class="mt-1 w-full px-4 py-3 bg-stone-800/50 border border-amber-900/30 rounded-lg text-stone-200 placeholder-stone-600 focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600/50 transition-all disabled:opacity-50"
        />
        @if (registerForm.password().invalid() && registerForm.password().touched()) {
          <p class="text-[10px] text-red-400 font-bold mt-1 uppercase tracking-tighter ml-1">
            {{ registerForm.password().errors()[0].message }}
          </p>
        }
      </label>

      <!-- Confirmar Contraseña -->
      <label class="block">
        <span class="text-xs font-bold uppercase text-stone-300 tracking-wider ml-1"
          >Confirmar Contraseña</span
        >
        <input
          [formField]="registerForm.passwordConfirmation"
          type="password"
          placeholder="••••••••"
          autocomplete="new-password"
          class="mt-1 w-full px-4 py-3 bg-stone-800/50 border border-amber-900/30 rounded-lg text-stone-200 placeholder-stone-600 focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600/50 transition-all disabled:opacity-50"
        />
        @if (
          registerForm.passwordConfirmation().invalid() &&
          registerForm.passwordConfirmation().touched()
        ) {
          <p class="text-[10px] text-red-400 font-bold mt-1 uppercase tracking-tighter ml-1">
            {{ registerForm.passwordConfirmation().errors()[0].message }}
          </p>
        }
      </label>

      <!-- Submit -->
      <div class="pt-2">
        <button
          type="button"
          (click)="submit()"
          [disabled]="registerForm().invalid() || isLoading()"
          class="w-full py-3 bg-amber-600 hover:bg-amber-500 disabled:bg-stone-700 disabled:cursor-not-allowed text-stone-900 font-bold rounded-lg transition-all disabled:opacity-50 uppercase text-sm tracking-wide shadow-lg shadow-amber-900/30"
        >
          @if (isLoading()) {
            <span class="animate-pulse">Creando cuenta...</span>
          } @else {
            Crear Cuenta
          }
        </button>
      </div>
    </form>

    <!-- Footer links -->
    <div class="mt-8 text-center space-y-3">
      <p class="text-stone-400 text-sm">
        ¿Ya tienes cuenta?
        <a
          routerLink="/auth/login"
          class="text-amber-400 hover:text-amber-300 font-bold transition-colors"
        >
          Inicia sesión aquí
        </a>
      </p>
      <a
        routerLink="/"
        class="inline-block text-xs text-stone-500 hover:text-stone-300 transition-colors"
      >
        Volver al inicio
      </a>
    </div>
  </div>
</div>
