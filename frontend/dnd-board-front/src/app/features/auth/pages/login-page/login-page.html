@if (!show2FA()) {
  <app-login
    (loginOutput)="handleLogin($event)"
    [isLoading]="isLoading()"
    [errorMessage]="loginError()"
    [loadingGoogle]="loadingGoogle()"
    (googleClick)="redirectToGoogle()"
  />
} @else {
  <!-- Sección 2FA -->
  <div class="min-h-screen bg-stone-950 flex items-center justify-center px-4">
    <div
      class="w-full max-w-md bg-stone-900/60 border border-amber-900/30 rounded-2xl p-8 shadow-xl text-center"
    >
      <div class="mb-8">
        <h2 class="text-3xl font-black text-amber-400 uppercase tracking-wider">
          Verificación 2FA
        </h2>
        <p class="text-stone-400 text-sm mt-2">
          Introduce el código de tu aplicación de autenticación
        </p>
      </div>

      <input
        #codeInput
        type="text"
        maxlength="6"
        placeholder="000000"
        (keyup.enter)="handleVerify2FA(codeInput.value)"
        class="w-full px-4 py-4 bg-stone-800/50 border border-amber-600/30 rounded-lg text-stone-200 placeholder-stone-600 text-center text-3xl font-mono tracking-[0.4em] focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500/50 transition-all"
      />

      @if (verify2faResource.error()) {
        <p class="mt-4 text-red-400 font-bold uppercase text-[10px] tracking-widest">
          Código inválido o expirado
        </p>
      }

      <div class="mt-6 flex flex-col gap-3">
        <button
          type="button"
          (click)="handleVerify2FA(codeInput.value)"
          [disabled]="isLoading()"
          class="w-full py-3 bg-amber-600 hover:bg-amber-500 disabled:bg-stone-700 disabled:cursor-not-allowed text-stone-900 font-bold rounded-lg transition-all uppercase text-sm tracking-wide"
        >
          @if (isLoading()) {
            <span class="animate-pulse">Verificando...</span>
          } @else {
            Verificar
          }
        </button>
        <button
          type="button"
          (click)="cancel2FA()"
          class="text-xs font-bold uppercase tracking-widest text-stone-500 hover:text-amber-400 transition-colors py-2"
        >
          Volver al login
        </button>
      </div>
    </div>
  </div>
}
