<div
  class="fixed inset-0 bg-stone-950/90 backdrop-blur-md z-[100] flex items-center justify-center p-4"
>
  <div
    class="bg-stone-900 border border-amber-900/40 p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl"
  >
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-xl font-black uppercase italic text-stone-100">
        Activar <span class="text-amber-400">2FA</span>
      </h3>
      <button (click)="dismiss()" class="text-stone-500 hover:text-stone-300 transition-colors">
        <fa-icon [icon]="faXmark" class="text-lg" />
      </button>
    </div>

    @if (setupResource.isLoading()) {
      <div
        class="py-12 animate-pulse text-amber-500 text-[10px] font-black uppercase tracking-widest"
      >
        Generando código...
      </div>
    } @else if (setupResource.value(); as setup) {
      <div class="bg-white p-3 rounded-xl inline-block mb-6 shadow-xl">
        <img
          [src]="
            'https://api.qrserver.com/v1/create-qr-code/?data=' +
            setup.qr_code_url +
            '&size=200x200'
          "
          class="w-48 h-48"
          alt="QR Code 2FA"
        />
      </div>
      <p class="text-stone-400 text-xs mb-4">
        Escanea el QR con tu app de autenticación e introduce el código de 6 dígitos
      </p>
      <input
        #code
        type="text"
        maxlength="6"
        placeholder="000000"
        class="w-full bg-stone-950 border border-stone-700 rounded-xl p-3 text-center text-2xl font-mono mb-4 text-amber-400 outline-none focus:border-amber-600 transition-colors tracking-widest"
      />
      <button
        (click)="confirm(code.value)"
        [disabled]="activationResource.isLoading()"
        class="w-full py-3 bg-amber-600 hover:bg-amber-500 disabled:opacity-40 disabled:cursor-not-allowed text-stone-900 text-xs font-black uppercase tracking-widest rounded-xl transition-colors"
      >
        {{ activationResource.isLoading() ? 'Verificando...' : 'Confirmar código' }}
      </button>
      @if (activationResource.error()) {
        <p class="mt-3 text-red-400 text-xs">Código inválido. Inténtalo de nuevo.</p>
      }
    }
  </div>
</div>
