<div class="h-screen w-full overflow-hidden bg-stone-950">
  <main class="h-full w-full flex flex-col md:flex-row relative">
    <!-- Mis Partidas -->
    <a
      routerLink="/dashboard/my-boards"
      class="relative flex-1 group cursor-pointer overflow-hidden border-r border-white/5"
    >
      <img
        src="boards.jpg"
        alt="Mis Partidas"
        class="absolute inset-0 w-full h-full object-cover transition-transform duration-[3000ms] ease-out scale-110 group-hover:scale-105 opacity-40 group-hover:opacity-60"
      />

      <div
        class="absolute inset-0 bg-gradient-to-t from-stone-950 via-transparent to-transparent opacity-90"
      ></div>

      <div
        class="relative z-10 h-full flex flex-col items-center justify-center p-8 text-center animate-fade-in-up"
      >
        <div
          class="mb-6 p-6 bg-white/5 backdrop-blur-xl rounded-3xl border border-white/10 group-hover:border-amber-400/50 group-hover:bg-amber-700 transition-all duration-500 shadow-2xl"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="white"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="2" width="20" height="20" rx="3" />
            <path
              d="M16 8h.01M8 8h.01M12 12h.01M16 16h.01M8 16h.01"
              stroke-width="2.5"
              stroke-linecap="round"
            />
          </svg>
        </div>

        <h2
          class="text-4xl md:text-6xl font-black text-white uppercase tracking-tighter mb-4 italic"
        >
          Mis <br /><span class="text-amber-400">Partidas</span>
        </h2>

        <p
          class="text-stone-300 font-medium max-w-xs mx-auto mb-8 opacity-0 animate-fade-in [animation-delay:400ms] [animation-fill-mode:forwards]"
        >
          Crea tableros de batalla, gestiona tus campañas y lidera al grupo como Dungeon Master.
        </p>

        <div
          class="px-8 py-3 bg-amber-700 text-white text-sm font-black uppercase tracking-[0.3em] rounded-xl shadow-lg shadow-amber-900/40 group-hover:bg-amber-500 transition-all opacity-0 animate-fade-in [animation-delay:600ms] [animation-fill-mode:forwards]"
        >
          Ver Partidas
        </div>
      </div>
    </a>

    <!-- Mis Personajes -->
    <a
      routerLink="/dashboard/my-characters"
      class="relative flex-1 group cursor-pointer overflow-hidden"
    >
      <img
        src="characters.avif"
        alt="Mis Personajes"
        class="absolute inset-0 w-full h-full object-cover transition-transform duration-[3000ms] ease-out scale-110 group-hover:scale-105 opacity-40 group-hover:opacity-60"
      />

      <div
        class="absolute inset-0 bg-gradient-to-t from-stone-950 via-transparent to-transparent opacity-90"
      ></div>

      <div
        class="relative z-10 h-full flex flex-col items-center justify-center p-8 text-center animate-fade-in-up [animation-delay:200ms]"
      >
        <div
          class="mb-6 p-6 bg-white/5 backdrop-blur-xl rounded-3xl border border-white/10 group-hover:border-red-400/50 group-hover:bg-red-800 transition-all duration-500 shadow-2xl"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="white"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M14.5 10c-.83 0-1.5-.67-1.5-1.5v-5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5z"
            />
            <path d="M20.5 10H19V8.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" />
            <path
              d="M9.5 14c.83 0 1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5S8 21.33 8 20.5v-5c0-.83.67-1.5 1.5-1.5z"
            />
            <path d="M3.5 14H5v1.5c0 .83-.67 1.5-1.5 1.5S2 16.33 2 15.5 2.67 14 3.5 14z" />
            <path
              d="M14 14.5c0-.83.67-1.5 1.5-1.5h5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-5c-.83 0-1.5-.67-1.5-1.5z"
            />
            <path d="M15.5 19H14v1.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5-.67-1.5-1.5-1.5z" />
            <path
              d="M10 9.5C10 8.67 9.33 8 8.5 8h-5C2.67 8 2 8.67 2 9.5S2.67 11 3.5 11h5c.83 0 1.5-.67 1.5-1.5z"
            />
            <path d="M8.5 5H10V3.5C10 2.67 9.33 2 8.5 2S7 2.67 7 3.5 7.67 5 8.5 5z" />
          </svg>
        </div>

        <h2
          class="text-4xl md:text-6xl font-black text-white uppercase tracking-tighter mb-4 italic"
        >
          Mis <br /><span class="text-red-400">Personajes</span>
        </h2>

        <p
          class="text-stone-300 font-medium max-w-xs mx-auto mb-8 opacity-0 animate-fade-in [animation-delay:600ms] [animation-fill-mode:forwards]"
        >
          Crea y edita fichas de personaje con estadísticas, puntos de vida y habilidades únicas.
        </p>

        <div
          class="px-8 py-3 bg-red-800 text-white text-sm font-black uppercase tracking-[0.3em] rounded-xl shadow-lg shadow-red-900/40 group-hover:bg-red-600 transition-all opacity-0 animate-fade-in [animation-delay:800ms] [animation-fill-mode:forwards]"
        >
          Ver Personajes
        </div>
      </div>
    </a>
  </main>
</div>
