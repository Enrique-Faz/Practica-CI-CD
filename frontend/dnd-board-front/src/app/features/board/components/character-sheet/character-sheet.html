<div class="flex flex-col items-center gap-3">
  <!-- Imagen de clase -->
  <img
    [src]="classImage()"
    [alt]="character().class"
    class="w-full aspect-square rounded-xl object-cover border border-amber-900/40"
  />

  <!-- Nombre y clase -->
  <div class="text-center">
    <h3 class="text-base font-black text-stone-100 uppercase tracking-wide">
      {{ character().name }}
    </h3>
    <p class="text-xs text-amber-400/80 font-semibold capitalize">{{ character().class }}</p>
  </div>

  <!-- HP y Speed -->
  <div class="flex gap-3 w-full">
    <div class="flex-1 text-center py-1.5 bg-red-900/30 border border-red-700/40 rounded-lg">
      <p class="text-[10px] text-stone-500 uppercase font-bold">HP</p>
      <p class="text-lg font-black text-red-400">{{ character().hp }}</p>
    </div>
    <div class="flex-1 text-center py-1.5 bg-amber-900/20 border border-amber-700/30 rounded-lg">
      <p class="text-[10px] text-stone-500 uppercase font-bold">VEL</p>
      <p class="text-lg font-black text-amber-400">{{ character().speed }}</p>
    </div>
  </div>

  <!-- Stats grid -->
  <div class="grid grid-cols-3 gap-2 w-full">
    @for (stat of stats(); track stat.label) {
      <div class="text-center py-1.5 bg-stone-800/60 border border-stone-700/40 rounded-lg">
        <p class="text-[10px] text-stone-500 uppercase font-bold tracking-wider">
          {{ stat.label }}
        </p>
        <p class="text-lg font-black text-stone-200">{{ stat.value }}</p>
      </div>
    }
  </div>
</div>
