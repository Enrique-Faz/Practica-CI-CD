<div class="flex flex-col h-screen bg-stone-950 text-stone-100 overflow-hidden">
  <!-- Loading inicial (sin datos previos) -->
  @if (!board() && boardResource.isLoading()) {
    <div class="flex-1 flex items-center justify-center">
      <span class="text-stone-400 animate-pulse">Cargando tablero...</span>
    </div>
  } @else if (!board() && boardResource.error()) {
    <div class="flex-1 flex items-center justify-center">
      <span class="text-red-400">No se pudo cargar el tablero.</span>
    </div>
  } @else if (board()) {
    <!-- Toolbar superior (solo DM) -->
    @if (isDm()) {
      <div
        class="flex items-center gap-3 px-4 py-2 bg-stone-900 border-b border-stone-800 shrink-0"
      >
        <app-grid-config-panel
          [board]="board()!"
          (onGridSaved)="onGridSaved($event)"
          (previewChanged)="previewGrid.set($event)"
        />

        <!-- Controles de zoom -->
        <div class="flex items-center gap-2 ml-auto">
          <button
            (click)="zoomOut()"
            class="w-7 h-7 flex items-center justify-center bg-stone-800 hover:bg-stone-700 rounded text-sm font-bold"
          >
            −
          </button>
          <span class="text-xs text-stone-400 w-10 text-center">{{ zoomPercent() }}%</span>
          <button
            (click)="zoomIn()"
            class="w-7 h-7 flex items-center justify-center bg-stone-800 hover:bg-stone-700 rounded text-sm font-bold"
          >
            +
          </button>
          <button (click)="resetZoom()" class="text-xs text-stone-500 hover:text-stone-300 px-2">
            Reset
          </button>
        </div>
      </div>
    }

    <!-- Layout principal -->
    <div class="flex flex-1 overflow-hidden relative">
      <!-- Grid del tablero (centro) -->
      <div class="flex-1 overflow-hidden">
        <app-board-grid
          [board]="board()!"
          [reachableCells]="reachableCells()"
          [selectedCharacter]="selectedCharacter()"
          [zoom]="zoom()"
          [panX]="panX()"
          [panY]="panY()"
          [previewGrid]="previewGrid()"
          (tokenClicked)="onTokenClicked($event)"
          (cellClicked)="onCellClicked($event)"
          (panChanged)="onPanChanged($event)"
        />
      </div>

      <!-- Botón toggle sidenav -->
      <button
        (click)="sideNavOpen.set(!sideNavOpen())"
        class="absolute top-3 right-3 z-20 w-9 h-9 flex items-center justify-center rounded-lg bg-stone-800/90 hover:bg-stone-700 border border-stone-700 text-stone-300 hover:text-stone-100 transition-colors backdrop-blur-sm"
        [class.right-[19rem]]="sideNavOpen()"
        [title]="sideNavOpen() ? 'Cerrar panel' : 'Abrir panel'"
      >
        <fa-icon [icon]="sideNavOpen() ? faChevronRight : faChevronLeft" />
      </button>

      <!-- Side nav panel -->
      <div
        class="flex flex-col gap-4 p-3 w-72 shrink-0 overflow-y-auto bg-stone-900/80 border-l border-stone-800 backdrop-blur-sm transition-transform duration-300 absolute top-0 right-0 h-full z-10"
        [class.translate-x-0]="sideNavOpen()"
        [class.translate-x-full]="!sideNavOpen()"
      >
        <app-side-nav-panel
          class="flex flex-col flex-1 min-h-0"
          [board]="board()!"
          [playerCharacter]="playerCharacter()"
          [canAdvanceTurn]="canAdvanceTurn()"
          [canEditInitiative]="isDm()"
          (nextTurn)="onNextTurn()"
          (orderChanged)="onOrderChanged($event)"
        />
      </div>
    </div>
  }
</div>
