<div class="bg-stone-900/60 border border-amber-900/30 rounded-2xl overflow-hidden">
  <table class="w-full">
    <thead>
      <tr class="border-b border-amber-900/30">
        <th class="text-left p-4 text-xs font-black uppercase tracking-widest text-stone-500">
          ID
        </th>
        <th class="text-left p-4 text-xs font-black uppercase tracking-widest text-stone-500">
          Nombre
        </th>
        <th class="text-left p-4 text-xs font-black uppercase tracking-widest text-stone-500">
          Email
        </th>
        <th class="text-left p-4 text-xs font-black uppercase tracking-widest text-stone-500">
          Rol
        </th>
        <th class="text-left p-4 text-xs font-black uppercase tracking-widest text-stone-500">
          2FA
        </th>
        <th class="p-4"></th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr class="border-b border-stone-800/50 hover:bg-stone-800/30 transition-colors">
          <td class="p-4 text-stone-500 text-sm font-mono">{{ user.id }}</td>
          <td class="p-4 font-bold text-stone-200">{{ user.firstName }} {{ user.lastName }}</td>
          <td class="p-4 text-stone-400 text-sm">{{ user.email }}</td>
          <td class="p-4">
            <span
              class="px-2 py-0.5 rounded text-[10px] font-black uppercase tracking-widest"
              [class.bg-red-900/40]="user.role === 'admin'"
              [class.text-red-400]="user.role === 'admin'"
              [class.bg-stone-800]="user.role !== 'admin'"
              [class.text-stone-500]="user.role !== 'admin'"
            >
              {{ user.role === 'admin' ? 'Admin' : 'Usuario' }}
            </span>
          </td>
          <td class="p-4">
            @if (user.google2fa_enabled) {
              <span class="text-emerald-400 text-xs font-black uppercase">Activo</span>
            } @else {
              <span class="text-stone-600 text-xs uppercase">—</span>
            }
          </td>
          <td class="p-4 text-right">
            @if (user.role !== 'admin') {
              <button
                (click)="delete.emit({ id: user.id, name: user.firstName + ' ' + user.lastName })"
                class="p-2 text-stone-600 hover:text-red-400 transition-colors"
              >
                <fa-icon [icon]="faTrash" />
              </button>
            }
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
